<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Client Brand – Website Requirements</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 1000px;
            margin: 0 auto;
            padding: 40px;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            padding-bottom: 20px;
            border-bottom: 3px solid #4361ee;
        }

        .header h1 {
            color: #4361ee;
            margin: 0;
            font-size: 32px;
        }

        .header .subtitle {
            color: #666;
            font-size: 18px;
            margin-top: 10px;
        }

        .meta-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 30px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
        }

        .section {
            margin-bottom: 30px;
            page-break-inside: avoid;
        }

        .section-title {
            color: #4361ee;
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 15px;
            padding-bottom: 5px;
            border-bottom: 2px solid #e9ecef;
        }

        .question {
            margin-bottom: 20px;
        }

        .question-label {
            font-weight: 600;
            color: #495057;
            margin-bottom: 8px;
        }

        .answer {
            padding: 12px;
            background: #f8f9fa;
            border-radius: 6px;
            border-left: 4px solid #4361ee;
        }

        .checkbox-answer {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 5px;
        }

        .checkbox-item {
            background: #e9ecef;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 14px;
        }

        .footer {
            margin-top: 50px;
            padding-top: 20px;
            border-top: 1px solid #dee2e6;
            text-align: center;
            color: #6c757d;
            font-size: 14px;
        }

        .watermark {
            position: fixed;
            bottom: 20px;
            right: 20px;
            opacity: 0.1;
            font-size: 48px;
            color: #4361ee;
            transform: rotate(-45deg);
        }
    </style>
</head>
<body>
    <div class="watermark">CLIENT BRAND</div>

    <div class="header">
        <h1>Client Brand</h1>
        <div class="subtitle">Shopify Store Requirements Document</div>
    </div>

    <div class="meta-info">
        <div>
            <strong>Date Generated:</strong> <span id="generatedDate">{{date}}</span>
        </div>
        <div>
            <strong>Reference ID:</strong> <span id="referenceId">{{id}}</span>
        </div>
    </div>

    <!-- Sections will be dynamically inserted here -->
    <div id="sectionsContainer"></div>

    <div class="footer">
        <p>This document serves as the project scope and build reference for the client's Shopify website.</p>
        <p>© <%= new Date().getFullYear() %> Client Brand. All rights reserved.</p>
    </div>
</body>
</html>
